name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [g++, clang++]
        exclude:
          - os: macos-latest
            cxx: g++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make CXX=${{ matrix.cxx }}
      - run: make test
      - run: make install PREFIX=$HOME/.local && $HOME/.local/bin/egm doctor
  pip:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is no longer available on ubuntu-latest or arm64 macos-latest.
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: egm doctor
      - run: cd /tmp && EGM_TEST_INSTALLED=1 python $GITHUB_WORKSPACE/tests/test_sdk.py
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
